name: Validar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Testar a build de produção
        env:
          SPA_BASE_URL: http://127.0.0.1:8000
        run: |
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          python3 -m http.server 8000 --bind 127.0.0.1 --directory dist > /tmp/semear-ci-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$SPA_BASE_URL/" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$SPA_BASE_URL/" > /dev/null
          npm test
          npm run test:contraste
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
